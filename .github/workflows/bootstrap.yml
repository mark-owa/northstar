name: Publish portfolio source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify project source
        run: |
          cat .bootstrap/part* | base64 -d > /tmp/project.tar.gz
          tar -tzf /tmp/project.tar.gz >/dev/null
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit expanded repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Northstar source and portfolio documentation"
          git push
